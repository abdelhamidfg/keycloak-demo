quarkus.http.port=${HTTP_PORT:8081}
quarkus.http.host=0.0.0.0
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/commerce-demo
quarkus.oidc.client-id=customer-api
quarkus.oidc.credentials.secret=${CLIENT_SECRET:demo-customer-api-secret}
quarkus.oidc.token.audience=customer-api
quarkus.oidc.devservices.enabled=false
quarkus.keycloak.policy-enforcer.enabled=true
quarkus.keycloak.policy-enforcer.enforcement-mode=enforcing
quarkus.keycloak.policy-enforcer.lazy-load-paths=false
quarkus.keycloak.policy-enforcer.paths.resource.name=Customers
quarkus.keycloak.policy-enforcer.paths.resource.paths=/api/customers,/api/customers/*
quarkus.keycloak.policy-enforcer.paths.resource.methods.read.method=GET
quarkus.keycloak.policy-enforcer.paths.resource.methods.read.scopes=read
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=false
